[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "oopz-tactical-overlay"
version = "0.6.2"
description = "A focused Oopz text-channel overlay for borderless games"
readme = "README.md"
requires-python = ">=3.11,<3.14"
dependencies = [
  "oopz-sdk==0.15.0",
  "PySide6-Essentials>=6.8,<7",
]

[project.optional-dependencies]
dev = [
  "pytest>=8,<9",
  "nuitka>=4.1,<5",
  "ordered-set>=4.1,<5",
  "zstandard>=0.24,<1",
]

[project.scripts]
oopz-tactical-overlay = "oopz_overlay.main:main"

[tool.hatch.build.targets.wheel]
packages = ["src/oopz_overlay"]

[tool.pytest.ini_options]
addopts = "-q"
testpaths = ["tests"]
